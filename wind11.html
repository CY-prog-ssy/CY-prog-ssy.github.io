<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Windows 11</title>
<style>
:root{
  --tb:48px;
  --accent:#0067c0;
  --accent-text:#fff;
  --bg:#f3f3f3;
  --bg2:#fafafa;
  --bg3:#ffffff;
  --text:#1b1b1b;
  --dim:#616161;
  --line:rgba(0,0,0,.08);
  --hover:rgba(0,0,0,.05);
  --taskbar:rgba(243,243,243,.82);
  --panel:rgba(249,249,249,.86);
  --shadow:0 8px 32px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.06);
}
body.dark{
  --accent:#4cc2ff;
  --accent-text:#003350;
  --bg:#202020;
  --bg2:#272727;
  --bg3:#2d2d2d;
  --text:#f2f2f2;
  --dim:#a8a8a8;
  --line:rgba(255,255,255,.08);
  --hover:rgba(255,255,255,.06);
  --taskbar:rgba(32,32,32,.82);
  --panel:rgba(43,43,43,.86);
  --shadow:0 8px 32px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.07);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  font-size:13px;color:var(--text);background:#04060d;
  -webkit-font-smoothing:antialiased;
  user-select:none;
}
input,textarea{user-select:text;font-family:inherit}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:default}
svg{display:block}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.45);border:4px solid transparent;background-clip:content-box;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,.7);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============ 桌面 ============ */
#desktop{position:fixed;inset:0;overflow:hidden}
#wallpaper{position:absolute;inset:0;background:#04060d;transition:filter .25s}
#wallpaper svg{width:100%;height:100%}
#icons{position:absolute;top:0;left:0;right:0;bottom:var(--tb);padding:6px}
.dt-icon{
  position:absolute;width:86px;padding:8px 4px 6px;border-radius:4px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  color:#fff;font-size:12px;line-height:1.25;text-align:center;
  text-shadow:0 1px 4px rgba(0,0,0,.85);border:1px solid transparent;
}
.dt-icon svg{width:40px;height:40px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.dt-icon span{max-width:78px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.dt-icon:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.1)}
.dt-icon.sel{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.35)}

#windowLayer{position:absolute;inset:0 0 var(--tb) 0;pointer-events:none}

/* ============ 窗口 ============ */
.window{
  position:absolute;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);color:var(--text);
  border-radius:8px;pointer-events:auto;
  box-shadow:0 18px 50px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.28);
  animation:winIn .16s cubic-bezier(.2,.9,.3,1);
  transition:box-shadow .15s,border-radius .1s;
}
body.dark .window{box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1)}
.window.max{border-radius:0}
.window.closing{animation:winOut .13s ease-in forwards}
@keyframes winIn{from{transform:scale(.93);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes winOut{to{transform:scale(.94);opacity:0}}
.window:not(.focused){box-shadow:0 12px 34px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.16)}
.window:not(.focused) .titlebar{opacity:.72}

.titlebar{height:34px;display:flex;align-items:center;flex:0 0 auto;font-size:12px;position:relative}
.tb-title{flex:1;display:flex;align-items:center;gap:8px;padding-left:14px;overflow:hidden;white-space:nowrap;min-width:0}
.tb-title svg{width:16px;height:16px;flex:0 0 auto}
.tb-title span{overflow:hidden;text-overflow:ellipsis}
.win-ctrl{display:flex;height:100%;flex:0 0 auto}
.wc{width:46px;height:100%;display:grid;place-items:center;transition:background .1s}
.wc svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1.1}
.wc:hover{background:var(--hover)}
.wc-close:hover{background:#c42b1c;color:#fff}
.win-body{flex:1;overflow:hidden;position:relative;background:var(--bg3);display:flex;flex-direction:column}
.win-resize{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;z-index:5}
.window.max .win-resize{display:none}

/* ============ 任务栏 ============ */
#taskbar{
  position:fixed;left:0;right:0;bottom:0;height:var(--tb);z-index:9000;
  background:var(--taskbar);
  backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  border-top:1px solid rgba(255,255,255,.12);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:0 8px;
}
body.dark #taskbar{border-top-color:rgba(255,255,255,.06)}
.tb-center{display:flex;align-items:center;gap:4px;justify-self:center}
.tb-btn{
  width:42px;height:40px;border-radius:5px;display:grid;place-items:center;
  position:relative;transition:background .1s;
}
.tb-btn svg{width:22px;height:22px}
.tb-btn:hover{background:var(--hover)}
.tb-btn.active{background:var(--hover)}
.tb-btn.active::after{
  content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:16px;height:3px;border-radius:2px;background:var(--accent);transition:width .15s;
}
.tb-btn.running::after{
  content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:6px;height:3px;border-radius:2px;background:var(--dim);opacity:.75;
}
.tb-btn.running.active::after{width:16px;background:var(--accent);opacity:1}
.tb-sep{width:1px;height:22px;background:var(--line);margin:0 6px}

.tb-tray{display:flex;align-items:center;gap:2px;justify-self:end;padding-right:4px}
.tray-btn{height:40px;padding:0 8px;border-radius:5px;display:flex;align-items:center;gap:6px;transition:background .1s}
.tray-btn:hover{background:var(--hover)}
.tray-btn svg{width:16px;height:16px}
#clock{height:40px;padding:0 10px;border-radius:5px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;font-size:12px;line-height:1.35;transition:background .1s}
#clock:hover{background:var(--hover)}
.tray-badge{position:absolute;transform:translate(12px,-10px);font-size:10px}

/* ============ 通用面板 ============ */
.panel{
  position:fixed;z-index:9500;background:var(--panel);
  backdrop-filter:blur(50px) saturate(180%);
  -webkit-backdrop-filter:blur(50px) saturate(180%);
  border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
  opacity:0;visibility:hidden;transform:translateY(24px) scale(.98);
  transition:opacity .18s,transform .22s cubic-bezier(.2,.9,.3,1),visibility .18s;
  pointer-events:none;
}
.panel.open{opacity:1;visibility:visible;transform:none;pointer-events:auto}

/* ============ 开始菜单 ============ */
#startMenu{
  left:50%;bottom:calc(var(--tb) + 8px);width:640px;margin-left:-320px;
  padding:26px 34px 14px;transform-origin:50% 100%;
  display:flex;flex-direction:column;max-height:min(700px,calc(100vh - 80px));
}
#startMenu.open{transform:none}
.sm-search{
  display:flex;align-items:center;gap:10px;height:36px;padding:0 14px;
  background:var(--bg3);border:1px solid var(--line);border-radius:18px;flex:0 0 auto;
}
body.dark .sm-search{background:#333}
.sm-search svg{width:16px;height:16px;color:var(--dim);flex:0 0 auto}
.sm-search input{flex:1;background:none;border:0;outline:none;font-size:13px;color:var(--text)}
.sm-search input::placeholder{color:var(--dim)}
.sm-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px;flex:0 0 auto}
.sm-head span{font-size:13px;font-weight:600}
.sm-more{font-size:12px;padding:5px 10px;border-radius:4px;background:var(--hover);display:flex;align-items:center;gap:5px}
.sm-more:hover{background:rgba(0,0,0,.09)}
body.dark .sm-more:hover{background:rgba(255,255,255,.1)}
.sm-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;flex:0 1 auto;overflow-y:auto}
.sm-item{
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px 12px;
  border-radius:6px;font-size:12px;transition:background .1s;
}
.sm-item:hover{background:var(--hover)}
.sm-item svg{width:32px;height:32px}
.sm-item span{max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sm-rec{display:grid;grid-template-columns:1fr 1fr;gap:2px;flex:0 0 auto}
.sm-rec-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:6px;text-align:left}
.sm-rec-item:hover{background:var(--hover)}
.sm-rec-item svg{width:28px;height:28px;flex:0 0 auto}
.sm-rec-item .dim{color:var(--dim);font-size:11px;margin-top:2px}
.sm-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding:10px 6px;border-top:1px solid var(--line);flex:0 0 auto}
.sm-user{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:5px;font-size:13px}
.sm-user:hover{background:var(--hover)}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(140deg,#5b8def,#7c4dff);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:600}
.sm-power{width:40px;height:40px;border-radius:5px;display:grid;place-items:center}
.sm-power:hover{background:var(--hover)}
.sm-power svg{width:18px;height:18px}

/* ============ 快速设置 ============ */
#quickSettings{
  right:12px;bottom:calc(var(--tb) + 8px);width:360px;padding:20px 18px 16px;transform-origin:100% 100%;
}
.qs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qs-tile{
  background:var(--bg3);border:1px solid var(--line);border-radius:6px;
  padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;
  font-size:11.5px;transition:.12s;min-height:76px;justify-content:center;
}
body.dark .qs-tile{background:#333}
.qs-tile svg{width:20px;height:20px}
.qs-tile.on{background:var(--accent);color:var(--accent-text);border-color:transparent}
.qs-tile.on svg{color:var(--accent-text)}
.qs-tile:hover{filter:brightness(.96)}
.qs-slider{display:flex;align-items:center;gap:12px;margin-top:16px}
.qs-slider svg{width:18px;height:18px;color:var(--dim);flex:0 0 auto}
input[type=range]{
  -webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;
  background:linear-gradient(90deg,var(--accent) var(--p,70%),var(--line) var(--p,70%));
  outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--accent);border:4px solid var(--bg3);box-shadow:0 0 0 1px var(--line);
  cursor:pointer;
}
.qs-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
.qs-foot svg{width:16px;height:16px}

/* ============ 通知中心 ============ */
#notifCenter{
  right:12px;bottom:calc(var(--tb) + 8px);width:380px;padding:16px;transform-origin:100% 100%;
  max-height:calc(100vh - 80px);overflow-y:auto;
}
.nc-notif{
  background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:12px 14px;
  display:flex;gap:12px;margin-bottom:10px;
}
body.dark .nc-notif{background:#333}
.nc-notif svg{width:26px;height:26px;flex:0 0 auto}
.nc-notif .t{font-size:12.5px;font-weight:600;margin-bottom:3px}
.nc-notif .d{font-size:11.5px;color:var(--dim);line-height:1.5}
.nc-cal{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:14px}
body.dark .nc-cal{background:#333}
.nc-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:13px;font-weight:600}
.nc-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:11.5px}
.nc-cal-grid div{padding:6px 0;border-radius:50%;aspect-ratio:1;display:grid;place-items:center}
.nc-cal-grid .wk{color:var(--dim);font-size:11px}
.nc-cal-grid .today{background:var(--accent);color:#fff;font-weight:600}
.nc-cal-grid .oth{color:var(--dim);opacity:.45}

/* ============ 右键菜单 ============ */
#ctxMenu{
  position:fixed;z-index:9800;min-width:230px;padding:6px;
  background:var(--panel);backdrop-filter:blur(50px) saturate(180%);
  -webkit-backdrop-filter:blur(50px) saturate(180%);
  border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);
  display:none;
}
#ctxMenu.open{display:block;animation:ctxIn .12s ease-out}
@keyframes ctxIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.ctx-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:5px;font-size:12.5px;width:100%;text-align:left}
.ctx-item:hover{background:var(--hover)}
.ctx-item svg{width:16px;height:16px;color:var(--dim)}
.ctx-item .k{margin-left:auto;font-size:11px;color:var(--dim)}
.ctx-sep{height:1px;background:var(--line);margin:5px 8px}

/* ============ 快照预览 ============ */
#snapPreview{
  position:fixed;z-index:8000;border-radius:8px;pointer-events:none;
  background:rgba(140,180,255,.25);border:1px solid rgba(160,200,255,.6);
  backdrop-filter:blur(6px);opacity:0;transition:opacity .12s,all .13s cubic-bezier(.2,.9,.3,1);
}
#snapPreview.on{opacity:1}

/* ============ 关机层 ============ */
#shutdown{
  position:fixed;inset:0;z-index:99999;background:#000;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s;
}
#shutdown.on{opacity:1;visibility:visible}
.spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#shutdown p{font-size:14px;color:#bbb;letter-spacing:.5px}

/* ============ 应用通用样式 ============ */
.app-toolbar{
  display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);
  flex:0 0 auto;background:var(--bg2);font-size:12px;
}
body.dark .app-toolbar{background:#2a2a2a}
.app-tool{
  padding:5px 10px;border-radius:4px;display:flex;align-items:center;gap:6px;transition:background .1s;
}
.app-tool:hover{background:var(--hover)}
.app-tool svg{width:15px;height:15px}
.dim{color:var(--dim)}

/* ---- 文件资源管理器 ---- */
.ex{display:flex;flex-direction:column;height:100%}
.ex-bar{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);flex:0 0 auto;background:var(--bg2)}
body.dark .ex-bar{background:#2a2a2a}
.ex-ic{width:30px;height:30px;border-radius:5px;display:grid;place-items:center;transition:background .1s}
.ex-ic:hover{background:var(--hover)}
.ex-ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ex-addr{
  flex:1;height:30px;background:var(--bg3);border:1px solid var(--line);border-radius:4px;
  display:flex;align-items:center;padding:0 12px;font-size:12px;gap:6px;overflow:hidden;
}
body.dark .ex-addr{background:#333}
.ex-addr b{font-weight:400}
.ex-addr i{color:var(--dim);font-style:normal}
.ex-search input{
  width:170px;height:30px;background:var(--bg3);border:1px solid var(--line);border-radius:4px;
  padding:0 10px;outline:none;font-size:12px;color:var(--text);
}
body.dark .ex-search input{background:#333}
.ex-body{flex:1;display:flex;overflow:hidden}
.ex-side{
  width:210px;flex:0 0 auto;border-right:1px solid var(--line);padding:8px 6px;overflow-y:auto;background:var(--bg2);
}
body.dark .ex-side{background:#262626}
.ex-side-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:5px;font-size:12.5px;width:100%;text-align:left}
.ex-side-item:hover{background:var(--hover)}
.ex-side-item.on{background:var(--hover);font-weight:600}
.ex-side-item svg{width:16px;height:16px;flex:0 0 auto}
.ex-main{flex:1;overflow-y:auto;padding:14px}
.ex-crumb{font-size:12px;color:var(--dim);margin-bottom:12px;display:flex;gap:6px;align-items:center}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.ex-item{
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:6px;
  font-size:12px;text-align:center;transition:background .1s;border:1px solid transparent;
}
.ex-item:hover{background:var(--hover);border-color:var(--line)}
.ex-item svg{width:44px;height:44px}
.ex-item span{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-status{flex:0 0 auto;border-top:1px solid var(--line);padding:6px 14px;font-size:11.5px;color:var(--dim);background:var(--bg2)}
body.dark .ex-status{background:#2a2a2a}

/* ---- 记事本 ---- */
.np{display:flex;flex-direction:column;height:100%}
.np-menu{display:flex;gap:2px;padding:4px 8px;border-bottom:1px solid var(--line);font-size:12.5px;background:var(--bg2);flex:0 0 auto}
body.dark .np-menu{background:#2a2a2a}
.np-menu button{padding:5px 11px;border-radius:4px}
.np-menu button:hover{background:var(--hover)}
.np textarea{
  flex:1;border:0;outline:none;resize:none;padding:16px 18px;font-size:14px;line-height:1.65;
  background:var(--bg3);color:var(--text);font-family:"Consolas","Cascadia Mono","Microsoft YaHei",monospace;
}
.np-status{flex:0 0 auto;border-top:1px solid var(--line);padding:5px 14px;font-size:11.5px;color:var(--dim);display:flex;gap:20px;background:var(--bg2)}
body.dark .np-status{background:#2a2a2a}

/* ---- 计算器 ---- */
.calc{display:flex;flex-direction:column;height:100%;padding:0 8px 8px}
.calc-mode{font-size:14px;font-weight:600;padding:14px 12px 8px;flex:0 0 auto}
.calc-disp{
  padding:8px 12px 14px;text-align:right;font-size:42px;font-weight:600;
  overflow:hidden;white-space:nowrap;flex:0 0 auto;letter-spacing:-1px;
}
.calc-hist{text-align:right;font-size:12px;color:var(--dim);padding:0 12px 4px;height:16px;overflow:hidden}
.calc-keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.calc-keys button{
  border-radius:5px;background:var(--bg2);font-size:15px;transition:background .1s;
  display:grid;place-items:center;
}
body.dark .calc-keys button{background:#3a3a3a}
.calc-keys button:hover{background:var(--hover)}
body.dark .calc-keys button:hover{background:#454545}
.calc-keys button.fn{font-size:13px}
.calc-keys button.eq{background:var(--accent);color:#fff}
.calc-keys button.eq:hover{filter:brightness(1.15)}
body.dark .calc-keys button.eq{color:#00243a}

/* ---- 终端 ---- */
.term{flex:1;background:#0c0c0c;color:#ccc;font-family:"Cascadia Mono","Consolas",monospace;font-size:13px;padding:12px 14px;overflow-y:auto;line-height:1.5}
.term .l{white-space:pre-wrap;word-break:break-all}
.term .ok{color:#16c60c}
.term .in{color:#fff}
.term-in{display:flex;gap:0;flex-wrap:wrap}
.term-in input{
  flex:1;min-width:120px;background:none;border:0;outline:none;color:#fff;
  font-family:inherit;font-size:inherit;caret-color:#fff;
}

/* ---- 设置 ---- */
.st{display:flex;height:100%}
.st-side{
  width:280px;flex:0 0 auto;padding:14px 10px;overflow-y:auto;background:var(--bg2);border-right:1px solid var(--line);
}
body.dark .st-side{background:#262626}
.st-user{display:flex;align-items:center;gap:12px;padding:8px 12px 18px}
.st-user .av{width:38px;height:38px;font-size:15px}
.st-user .n{font-size:13px}
.st-user .e{font-size:11px;color:var(--dim);margin-top:2px}
.st-nav button{
  display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:5px;
  font-size:12.5px;text-align:left;position:relative;margin-bottom:1px;
}
.st-nav button:hover{background:var(--hover)}
.st-nav button.on{background:var(--hover);font-weight:600}
.st-nav button.on::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:16px;border-radius:2px;background:var(--accent);
}
.st-nav svg{width:16px;height:16px;flex:0 0 auto}
.st-main{flex:1;overflow-y:auto;padding:26px 32px}
.st-title{font-size:22px;font-weight:600;margin-bottom:20px}
.st-card{
  background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:16px 20px;margin-bottom:12px;
  display:flex;align-items:center;gap:16px;
}
body.dark .st-card{background:#2c2c2c}
.st-card svg{width:24px;height:24px;flex:0 0 auto;color:var(--accent)}
.st-card .tt{font-size:13px;font-weight:600;margin-bottom:3px}
.st-card .ss{font-size:11.5px;color:var(--dim)}
.st-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);font-size:13px}
.st-row:last-child{border:0}
.theme-pick{display:flex;gap:14px;margin-top:6px}
.theme-opt{text-align:center;font-size:12px}
.theme-thumb{
  width:110px;height:72px;border-radius:6px;border:2px solid transparent;margin-bottom:8px;overflow:hidden;
  display:flex;flex-direction:column;
}
.theme-opt.on .theme-thumb{border-color:var(--accent)}
.theme-thumb .tt{flex:1}
.theme-thumb .bb{height:14px}
.swatch{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.swatch button{width:32px;height:32px;border-radius:5px;border:2px solid transparent}
.swatch button.on{border-color:var(--text);outline:2px solid var(--bg3);outline-offset:-4px}

/* ---- 浏览器 ---- */
.br{display:flex;flex-direction:column;height:100%}
.br-tabs{display:flex;align-items:flex-end;gap:2px;padding:6px 8px 0;background:var(--bg2);flex:0 0 auto}
body.dark .br-tabs{background:#242424}
.br-tab{
  padding:8px 14px;border-radius:8px 8px 0 0;font-size:12px;display:flex;align-items:center;gap:8px;
  background:var(--bg3);max-width:200px;
}
body.dark .br-tab{background:#333}
.br-tab svg{width:14px;height:14px}
.br-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg3);border-bottom:1px solid var(--line);flex:0 0 auto}
body.dark .br-bar{background:#333}
.br-bar .url{
  flex:1;height:32px;border-radius:16px;background:var(--bg2);display:flex;align-items:center;gap:8px;
  padding:0 14px;font-size:12.5px;color:var(--dim);
}
body.dark .br-bar .url{background:#242424}
.br-page{flex:1;overflow-y:auto;background:#fff;color:#202124;padding:0}
body.dark .br-page{background:#1e1e1e;color:#e0e0e0}
.br-hero{
  height:220px;background:linear-gradient(135deg,#0b5ed7,#4cc2ff 60%,#7c4dff);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;
}
.br-hero h1{font-size:30px;font-weight:600;letter-spacing:.5px}
.br-search{
  width:min(560px,80%);height:44px;border-radius:22px;background:#fff;display:flex;align-items:center;
  padding:0 20px;box-shadow:0 6px 22px rgba(0,0,0,.25);color:#555;font-size:13.5px;gap:10px;
}
.br-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;padding:26px 30px}
.br-tile{
  border:1px solid #e3e3e3;border-radius:10px;padding:16px;background:#fafafa;transition:.15s;
}
body.dark .br-tile{background:#2a2a2a;border-color:#3a3a3a}
.br-tile:hover{box-shadow:0 4px 16px rgba(0,0,0,.12);transform:translateY(-2px)}
.br-tile .ic{width:34px;height:34px;border-radius:8px;margin-bottom:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.br-tile .n{font-size:13px;font-weight:600;margin-bottom:4px}
.br-tile .u{font-size:11.5px;color:#888}

/* ---- 照片 ---- */
.ph{padding:18px;overflow-y:auto;height:100%}
.ph h2{font-size:18px;font-weight:600;margin-bottom:14px}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.ph-item{
  aspect-ratio:4/3;border-radius:8px;overflow:hidden;position:relative;
  transition:.18s;border:1px solid var(--line);
}
.ph-item:hover{transform:scale(1.03);box-shadow:0 8px 22px rgba(0,0,0,.25)}
.ph-item span{position:absolute;left:0;right:0;bottom:0;padding:20px 10px 8px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6))}

/* ---- 商店 ---- */
.sto{padding:20px 24px;overflow-y:auto;height:100%}
.sto h2{font-size:18px;font-weight:600;margin-bottom:16px}
.sto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.sto-card{text-align:center;padding:16px;border-radius:8px;border:1px solid var(--line);transition:.15s}
.sto-card:hover{background:var(--hover)}
.sto-card svg{width:52px;height:52px;margin:0 auto 12px}
.sto-card .n{font-size:12.5px;font-weight:600;margin-bottom:10px}
.sto-card .btn{font-size:11.5px;padding:5px 18px;border-radius:4px;background:var(--accent);color:#fff;display:inline-block}

/* ---- 空状态 ---- */
.empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--dim);
}
.empty svg{width:72px;height:72px;opacity:.35}
</style>
</head>

(function buildWallpaper(){
  const petals = [];
  const grads = [
    ['#7cc4ff','#1b3a8f'],
    ['#4a7dff','#101f5c'],
    ['#a78bfa','#2a1d6b'],
    ['#38bdf8','#0b2a6b'],
    ['#7cc4ff','#1b3a8f'],
    ['#4a7dff','#101f5c'],
    ['#a78bfa','#2a1d6b'],
    ['#38bdf8','#0b2a6b']
  ];
  let defs = '';
  grads.forEach((g,i)=>{
    defs += `<radialGradient id="pg${i}" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stop-color="${g[0]}" stop-opacity=".95"/>
      <stop offset="60%" stop-color="${g[1]}" stop-opacity=".55"/>
      <stop offset="100%" stop-color="${g[1]}" stop-opacity="0"/>
    </radialGradient>`;
  });
  for(let i=0;i<8;i++){
    const a = i*45 + 22.5;
    petals.push(`<ellipse cx="0" cy="-215" rx="86" ry="215" transform="rotate(${a})" fill="url(#pg${i})" opacity=".9"/>`);
  }
  document.getElementById('wallpaper').innerHTML = `
  <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <defs>${defs}
      <filter id="soft"><feGaussianBlur stdDeviation="34"/></filter>
      <radialGradient id="bgGlow" cx="50%" cy="52%" r="55%">
        <stop offset="0%" stop-color="#123a8a"/>
        <stop offset="55%" stop-color="#071233"/>
        <stop offset="100%" stop-color="#03050d"/>
      </radialGradient>
    </defs>
    <rect width="1920" height="1080" fill="url(#bgGlow)"/>
    <g filter="url(#soft)" transform="translate(960,545) scale(1.05)">${petals.join('')}</g>
    <g filter="url(#soft)" transform="translate(960,545) scale(.5)" opacity=".85">${petals.join('')}</g>
  </svg>`;
})();

function openApp(appId, opts = {}){
  const app = APPS[appId];
  if(!app) return;

  const id = ++uid;
  const vw = innerWidth;
  const vh = innerHeight - TB;

  const W = Math.min(opts.w || app.w, vw - 24);
  const H = Math.min(opts.h || app.h, vh - 24);
  const n = (uid % 6);
  const X = Math.max(8, Math.min(vw - W - 8, Math.round((vw - W) / 2) + n*26 - 65));
  const Y = Math.max(8, Math.min(vh - H - 8, Math.round((vh - H) / 2) + n*22 - 55));

  const node = el('div','window');
  node.style.cssText = `left:${X}px;top:${Y}px;width:${W}px;height:${H}px;z-index:${++zTop}`;
  node.innerHTML = `
    <div class="titlebar">
      <div class="tb-title">${app.icon}<span>${app.name}</span></div>
      <div class="win-ctrl">
        <button class="wc wc-min" title="最小化">${ICON_MIN}</button>
        <button class="wc wc-max" title="最大化">${ICON_MAX}</button>
        <button class="wc wc-close" title="关闭">${ICON_CLOSE}</button>
      </div>
    </div>
    <div class="win-body"></div>
    <div class="win-resize"></div>`;
  winLayer.appendChild(node);

  const body = node.querySelector('.win-body');
  const win = {
    id, appId, node, body,
    min:false, max:false, prev:null,
    taskBtn:null,
    title: app.name
  };
  wins.set(id, win);

  /* 任务栏按钮 */
  const tb = el('button','tb-btn running', app.icon);
  tb.title = app.name;
  tb.addEventListener('click', () => {
    if(win.min){ restoreWin(win); }
    else if(node.classList.contains('focused')){ minimizeWin(win); }
    else { focusWin(win); }
  });
  tbApps.appendChild(tb);
  win.taskBtn = tb;

  /* 控制按钮 */
  node.querySelector('.wc-min').addEventListener('click', e => { e.stopPropagation(); minimizeWin(win); });
  node.querySelector('.wc-max').addEventListener('click', e => { e.stopPropagation(); toggleMax(win); });
  node.querySelector('.wc-close').addEventListener('click', e => { e.stopPropagation(); closeWin(win); });

  /* 最大化按钮悬停 → 吸附布局 */
  const maxBtn = node.querySelector('.wc-max');
  let snapTimer = null;
  maxBtn.addEventListener('mouseenter', () => {
    clearTimeout(snapTimer);
    snapTimer = setTimeout(() => showSnapMenu(win), 450);
  });
  maxBtn.addEventListener('mouseleave', () => {
    clearTimeout(snapTimer);
    setTimeout(() => hideSnapMenu(), 180);
  });

  /* 拖拽 */
  makeDraggable(win);
  /* 调整大小 */
  makeResizable(win, node.querySelector('.win-resize'));

  /* 点击置顶 */
  node.addEventListener('pointerdown', () => focusWin(win), true);

  /* 渲染内容 */
  if(typeof app.render === 'function') app.render(body, opts);

  focusWin(win);
  closeAllPanels();
  return win;
}

/* ---------- 焦点 / 最小化 / 关闭 ---------- */
function focusWin(win){
  wins.forEach(w => {
    w.node.classList.remove('focused');
    if(w.taskBtn) w.taskBtn.classList.remove('active');
  });
  win.node.classList.add('focused');
  win.node.style.zIndex = ++zTop;
  if(win.taskBtn) win.taskBtn.classList.add('active');
}

function minimizeWin(win){
  win.min = true;
  win.node.style.display = 'none';
  if(win.taskBtn) win.taskBtn.classList.remove('active');
  /* 焦点交给下一个 */
  const rest = [...wins.values()].filter(w=>!w.min && w.node.style.display!=='none');
  if(rest.length) focusWin(rest[rest.length-1]);
}

function restoreWin(win){
  win.min = false;
  win.node.style.display = 'flex';
  win.node.style.animation = 'none';
  requestAnimationFrame(() => {
    win.node.style.animation = 'winIn .16s cubic-bezier(.2,.9,.3,1)';
  });
  focusWin(win);
}

function closeWin(win){
  win.node.classList.add('closing');
  setTimeout(() => {
    win.node.remove();
    if(win.taskBtn) win.taskBtn.remove();
    wins.delete(win.id);
  }, 130);
}

/* ---------- 最大化 ---------- */
function toggleMax(win){
  const n = win.node;
  if(win.max){
    n.classList.remove('max');
    const p = win.prev || {x:80,y:60,w:860,h:560};
    n.style.left = p.x+'px'; n.style.top = p.y+'px';
    n.style.width = p.w+'px'; n.style.height = p.h+'px';
    win.max = false;
    n.querySelector('.wc-max').innerHTML = ICON_MAX;
  } else {
    win.prev = { x:n.offsetLeft, y:n.offsetTop, w:n.offsetWidth, h:n.offsetHeight };
    n.classList.add('max');
    n.style.left = '0px'; n.style.top = '0px';
    n.style.width = '100%'; n.style.height = '100%';
    win.max = true;
    n.querySelector('.wc-max').innerHTML = ICON_RESTORE;
  }
}

function setMax(win, on, rect){
  if(on === win.max && !rect) return;
  if(on){
    if(!win.max){
      win.prev = { x:win.node.offsetLeft, y:win.node.offsetTop, w:win.node.offsetWidth, h:win.node.offsetHeight };
    }
    win.node.classList.add('max');
    win.node.style.left='0px'; win.node.style.top='0px';
    win.node.style.width='100%'; win.node.style.height='100%';
    win.max = true;
    win.node.querySelector('.wc-max').innerHTML = ICON_RESTORE;
  } else {
    win.node.classList.remove('max');
    if(rect){
      win.node.style.left = rect.x+'px'; win.node.style.top = rect.y+'px';
      win.node.style.width = rect.w+'px'; win.node.style.height = rect.h+'px';
    }
    win.max = false;
    win.node.querySelector('.wc-max').innerHTML = ICON_MAX;
  }
}

/* ---------- 拖拽 + 吸附 ---------- */
let snapPreviewEl = null;
function ensureSnapPreview(){
  if(!snapPreviewEl) snapPreviewEl = $('#snapPreview');
  return snapPreviewEl;
}
let snapZone = null;

function checkSnapZone(x, y){
  const vw = innerWidth, vh = innerHeight - TB;
  if(y <= 2) return { type:'max' };
  if(x <= 2) return { type:'left' };
  if(x >= vw - 2) return { type:'right' };
  if(y >= vh - 2) return { type:'bottom' };
  return null;
}

function showSnapHint(zone){
  const sp = ensureSnapPreview();
  const vw = innerWidth, vh = innerHeight - TB;
  let r;
  switch(zone){
    case 'max':    r = {left:0, top:0, width:vw, height:vh}; break;
    case 'left':   r = {left:0, top:0, width:vw/2, height:vh}; break;
    case 'right':  r = {left:vw/2, top:0, width:vw/2, height:vh}; break;
    case 'bottom': r = {left:0, top:vh/2, width:vw, height:vh/2}; break;
    default: return;
  }
  sp.style.left = r.left+'px';
  sp.style.top = r.top+'px';
  sp.style.width = r.width+'px';
  sp.style.height = r.height+'px';
  sp.classList.add('on');
}

function hideSnapHint(){
  ensureSnapPreview().classList.remove('on');
}

function applySnap(win, zone){
  const vw = innerWidth, vh = innerHeight - TB;
  if(zone === 'max'){ setMax(win, true); return; }
  const wasMax = win.max;
  if(wasMax){
    win.node.classList.remove('max');
    win.max = false;
    win.node.querySelector('.wc-max').innerHTML = ICON_MAX;
  }
  const rect = zone === 'left'  ? {x:0, y:0, w:vw/2, h:vh} :
               zone === 'right' ? {x:vw/2, y:0, w:vw/2, h:vh} :
                                  {x:0, y:vh/2, w:vw, h:vh/2};
  win.prev = { x:win.node.offsetLeft, y:win.node.offsetTop, w:win.node.offsetWidth, h:win.node.offsetHeight };
  win.node.style.left = rect.x+'px';
  win.node.style.top = rect.y+'px';
  win.node.style.width = rect.w+'px';
  win.node.style.height = rect.h+'px';
}

function makeDraggable(win){
  const node = win.node;
  const bar = node.querySelector('.titlebar');

  bar.addEventListener('pointerdown', e => {
    if(e.button !== 0) return;
    if(e.target.closest('.win-ctrl')) return;

    focusWin(win);

    let startX = e.clientX, startY = e.clientY;
    let rect = node.getBoundingClientRect();
    let originLeft = rect.left, originTop = rect.top;
    let relX = (e.clientX - rect.left) / rect.width;
    let moved = false;
    let unmaxed = false;

    const onMove = ev => {
      const dx = ev.clientX - startX;
      const dy = ev.clientY - startY;

      if(!moved && Math.hypot(dx, dy) < 5) return;

      if(!moved && win.max && !unmaxed){
        /* 从最大化状态拖出 → 还原 */
        unmaxed = true;
        const pw = win.prev ? win.prev.w : Math.min(900, innerWidth*0.7);
        const ph = win.prev ? win.prev.h : Math.min(600, (innerHeight-TB)*0.7);
        node.classList.remove('max');
        win.max = false;
        node.querySelector('.wc-max').innerHTML = ICON_MAX;
        node.style.width = pw+'px';
        node.style.height = ph+'px';
        originLeft = ev.clientX - pw * relX;
        originTop = Math.max(0, ev.clientY - 17);
        startX = ev.clientX;
        startY = ev.clientY;
      }

      moved = true;
      const nx = Math.max(-node.offsetWidth + 90, Math.min(originLeft + dx, innerWidth - 90));
      const ny = Math.max(0, Math.min(originTop + dy, innerHeight - TB - 40));
      node.style.left = nx + 'px';
      node.style.top  = ny + 'px';

      const zone = checkSnapZone(ev.clientX, ev.clientY);
      if(zone){ snapZone = zone; showSnapHint(zone); }
      else { snapZone = null; hideSnapHint(); }
    };

    const onUp = () => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      hideSnapHint();
      if(moved && snapZone){
        applySnap(win, snapZone);
        snapZone = null;
      }
    };

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });

  /* 双击标题栏最大化 */
  bar.addEventListener('dblclick', e => {
    if(e.target.closest('.win-ctrl')) return;
    toggleMax(win);
  });
}

function makeResizable(win, handle){
  const node = win.node;
  handle.addEventListener('pointerdown', e => {
    e.stopPropagation();
    if(e.button !== 0) return;
    focusWin(win);
    const startX = e.clientX, startY = e.clientY;
    const w0 = node.offsetWidth, h0 = node.offsetHeight;

    const onMove = ev => {
      const w = Math.max(320, w0 + ev.clientX - startX);
      const h = Math.max(200, h0 + ev.clientY - startY);
      node.style.width = Math.min(w, innerWidth - node.offsetLeft) + 'px';
      node.style.height = Math.min(h, innerHeight - TB - node.offsetTop) + 'px';
    };
    const onUp = () => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
}

/* 窗口尺寸随视口变化 */
addEventListener('resize', () => {
  wins.forEach(w => {
    if(w.max) return;
    const n = w.node;
    if(n.offsetLeft + n.offsetWidth > innerWidth) n.style.left = Math.max(0, innerWidth - n.offsetWidth) + 'px';
    if(n.offsetTop + n.offsetHeight > innerHeight - TB) n.style.top = Math.max(0, innerHeight - TB - n.offsetHeight) + 'px';
  });
  if($('#notifCenter').classList.contains('open')) buildCalendar();
});

/* ---------- 吸附布局菜单（悬停最大化按钮） ---------- */
let snapMenuEl = null;
function showSnapMenu(win){
  hideSnapMenu();
  const menu = el('div','panel open');
  menu.style.cssText = `position:fixed;z-index:9700;padding:10px;width:auto;display:grid;
    grid-template-columns:repeat(2,64px);gap:8px;transform:none;`;

function appCalc(body){
  body.innerHTML = `
    <div class="calc">
      <div class="calc-mode">标准</div>
      <div class="calc-hist"></div>
      <div class="calc-disp">0</div>
      <div class="calc-keys"></div>
    </div>`;

  const keysEl = body.querySelector('.calc-keys');
  const dispEl = body.querySelector('.calc-disp');
  const histEl = body.querySelector('.calc-hist');

  const KEYS = [
    ['%','fn'],['CE','fn'],['C','fn'],['⌫','fn'],
    ['1/x','fn'],['x²','fn'],['√x','fn'],['÷','op'],
    ['7',''],['8',''],['9',''],['×','op'],
    ['4',''],['5',''],['6',''],['−','op'],
    ['1',''],['2',''],['3',''],['+','op'],
    ['+/−',''],['0',''],['.',''],['=','eq']
  ];

  KEYS.forEach(([k, cls]) => {
    const b = el('button', cls, k);
    b.dataset.k = k;
    keysEl.appendChild(b);
  });

  let disp = '0', acc = null, op = null, wait = false;

  const show = () => {
    dispEl.textContent = disp;
    histEl.textContent = acc !== null && op ? `${fmt(acc)} ${op}` : '';
  };
  const fmt = n => {
    if(!isFinite(n)) return '结果未定义';
    const s = parseFloat(n.toPrecision(12));
    return String(s);
  };
  const compute = (a,b,o) => {
    switch(o){
      case '+': return a+b;
      case '−': return a-b;
      case '×': return a*b;
      case '÷': return b === 0 ? NaN : a/b;
    }
    return b;
  };

  function press(k){
    if(/^[0-9]$/.test(k)){
      if(wait){ disp = k; wait = false; }
      else disp = disp === '0' ? k : disp + k;
      if(disp.replace(/[-.]/g,'').length > 15) disp = disp.slice(0, 16);
    }
    else if(k === '.'){
      if(wait){ disp = '0.'; wait = false; }
      else if(!disp.includes('.')) disp += '.';
    }
    else if(k === '+' || k === '−' || k === '×' || k === '÷'){
      if(op !== null && !wait){
        acc = compute(acc, parseFloat(disp), op);
        disp = fmt(acc);
      } else if(op === null){
        acc = parseFloat(disp);
      }
      op = k; wait = true;
    }
    else if(k === '='){
      if(op !== null){
        acc = compute(acc, parseFloat(disp), op);
        disp = fmt(acc);
        op = null; acc = null; wait = true;
      }
    }
    else if(k === 'C'){ disp='0'; acc=null; op=null; wait=false; }
    else if(k === 'CE'){ disp='0'; wait=false; }
    else if(k === '⌫'){ disp = disp.length > 1 ? disp.slice(0,-1) : '0'; if(disp==='-')disp='0'; }
    else if(k === '+/−'){ disp = disp.startsWith('-') ? disp.slice(1) : (disp === '0' ? '0' : '-'+disp); }
    else if(k === '%'){ disp = fmt(parseFloat(disp)/100); }
    else if(k === '1/x'){ disp = fmt(1/parseFloat(disp)); }
    else if(k === 'x²'){ disp = fmt(Math.pow(parseFloat(disp),2)); }
    else if(k === '√x'){ disp = fmt(Math.sqrt(parseFloat(disp))); }
    show();
  }

  keysEl.addEventListener('click', e => {
    const b = e.target.closest('button');
    if(b) press(b.dataset.k);
  });

  /* 键盘支持（窗口聚焦时） */
  show();
}

function appTerminal(body){
  body.innerHTML = `<div class="term"></div>`;
  const term = body.querySelector('.term');

  const user = 'C:\\Users\\Windows>';
  let buffer = [];

  function print(lines, cls=''){
    lines.forEach(l => {
      const d = el('div', 'l ' + cls, l);
      term.appendChild(d);
    });
    term.scrollTop = term.scrollHeight;
  }

  function prompt(){
    const row = el('div','term-in');
    row.innerHTML = `<span class="ok">${user}</span>`;
    const input = el('input');
    input.type = 'text';
    input.spellcheck = false;
    row.appendChild(input);
    term.appendChild(row);
    input.focus();
    term.scrollTop = term.scrollHeight;

    input.addEventListener('keydown', e => {
      if(e.key === 'Enter'){
        const cmd = input.value;
        const frozen = el('div','l in');
        frozen.innerHTML = `<span class="ok">${user}</span>${cmd.replace(/</g,'&lt;')}`;
        row.replaceWith(frozen);
        run(cmd);
        prompt();
      }
    });
  }

  const FILES = ['Users', 'Windows', 'Program Files', 'Temp', 'readme.txt'];

  const CMDS = {
    help: () => [
      '可用命令：',
      '  HELP       显示此帮助',
      '  DIR        列出当前目录内容',
      '  CD         切换目录',
      '  ECHO       显示文本',
      '  CLS        清屏',
      '  DATE       显示日期',
      '  TIME       显示时间',
      '  WHOAMI     显示当前用户',
      '  VER        显示系统版本',
      '  COLOR      更改文字颜色',
      '  EXIT       关闭此窗口'
    ],
    dir: () => {
      const out = [' 驱动器 C 中的卷没有标签。', ' 卷的序列号是 8A2C-4F19', '', ' C:\\Users 的目录', ''];
      FILES.forEach((f,i) => {
        const isDir = !f.includes('.');
        out.push(`2024/06/1${i%9}  0${i%9}:${10+i}    ${isDir ? '   <DIR>          ' : '            1,024 '}${f}`);
      });
      out.push(`               ${FILES.length} 个文件             0 字节`);
      out.push('               3 个目录  84,231,192,576 可用字节');
      return out;
    },
    cd: () => ['（这是模拟器，目录不可真正切换）'],
    echo: (args) => [args.join(' ') || 'ECHO 处于打开状态。'],
    cls: () => { term.innerHTML = ''; return []; },
    date: () => [`当前日期: ${new Date().toLocaleDateString('zh-CN')}`],
    time: () => [`当前时间: ${new Date().toLocaleTimeString('zh-CN')}`],
    whoami: () => ['desktop-7f3k2a\\windows'],
    ver: () => ['', 'Microsoft Windows [版本 11.0.22631.4169]', ''],
    color: () => ['颜色已更改（模拟）'],
    exit: () => { 
      const w = [...wins.values()].find(w => w.body === body);
      if(w) closeWin(w);
      return [];
    }
  };

  function run(raw){
    const line = raw.trim();
    if(!line) return;
    const [cmd, ...args] = line.split(/\s+/);
    const fn = CMDS[cmd.toLowerCase()];
    if(fn){
      const out = fn(args);
      if(out && out.length) print(out);
    } else {
      print([`'${cmd}' 不是内部或外部命令，也不是可运行的程序或批处理文件。`]);

  print([
    'Microsoft Windows [版本 11.0.22631.4169]',
    '(c) Microsoft Corporation。保留所有权利。',
    '',
    '输入 HELP 查看可用命令。',
    ''
  ]);
  prompt();

  /* 点击终端任意位置聚焦输入框 */
  term.addEventListener('click', () => {
    const inp = term.querySelector('input');
    if(inp) inp.focus();

}

   ========================================================= */
function buildCalendar(){
  const nc = $('#notifCenter');
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();

  let cells = '';
  const WK = ['日','一','二','三','四','五','六'];
  WK.forEach(w => cells += `<div class="wk">${w}</div>`);

  for(let i = firstDay - 1; i >= 0; i--){
    cells += `<div class="oth">${prevDays - i}</div>`;
  }
  for(let d = 1; d <= daysInMonth; d++){
    const today = (d === now.getDate());
    cells += `<div class="${today?'today':''}">${d}</div>`;
  }
  const rest = (7 - (firstDay + daysInMonth) % 7) % 7;
  for(let i = 1; i <= rest; i++){
    cells += `<div class="oth">${i}</div>`;
  }

  nc.innerHTML = `
    <div class="nc-notif">
      ${I.settings}
      <div><div class="t">系统 · Windows 更新</div>
      <div class="d">你的设备已是最新状态。上次检查：今天 ${now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</div></div>
    </div>
    <div class="nc-notif">
      ${I.mail}
      <div><div class="t">邮件 · 新邮件</div>
      <div class="d">你有 3 封未读邮件，来自「项目组」和「系统通知」。</div></div>
    </div>
    <div class="nc-cal">
      <div class="nc-cal-head">
        <span>${y} 年 ${m+1} 月</span>
        <span class="dim" style="font-size:11px">今天 ${now.getDate()} 日</span>
      </div>
      <div class="nc-cal-grid">${cells}</div>
    </div>`;
}

const ctx = $('#ctxMenu');

function showCtx(x, y, items){
  ctx.innerHTML = items.map(it => {
    if(it.sep) return `<div class="ctx-sep"></div>`;
    return `<button class="ctx-item" data-a="${it.a || ''}">${it.i || ''}<span>${it.t}</span>${it.k ? `<span class="k">${it.k}</span>` : ''}</button>`;
  }).join('');

  ctx.classList.add('open');
  const w = ctx.offsetWidth, h = ctx.offsetHeight;
  ctx.style.left = Math.min(x, innerWidth - w - 8) + 'px';
  ctx.style.top  = Math.min(y, innerHeight - h - 8) + 'px';
}

document.addEventListener('contextmenu', e => {
  e.preventDefault();
  if(e.target.closest('.window') || e.target.closest('.panel') || e.target.closest('#taskbar')) return;

  showCtx(e.clientX, e.clientY, [
    { t:'查看', i:I.display },

    { t:'刷新', i:I.refresh, a:'refresh' },
    { sep:true },
    { t:'新建文件夹', i:I.folder, a:'newfolder' },
    { t:'新建文本文档', i:I.notepad, a:'newnote' },
    { sep:true },
    { t:'显示设置', i:I.display, a:'displaysettings' },
    { t:'个性化', i:I.settings, a:'personalize' },
    { sep:true },
    { t:'在终端中打开', i:I.terminal, a:'terminal' }
  ]);
});

ctx.addEventListener('click', e => {

  ctx.classList.remove('open');

  switch(a){
    case 'refresh':
      document.querySelectorAll('.dt-icon').forEach(n => {
        n.style.transition = 'none';
        n.style.opacity = '.35';
        setTimeout(() => { n.style.transition='opacity .25s'; n.style.opacity='1'; }, 120);

    case 'newfolder': openApp('explorer'); break;

});

  if(!b || !ctx._win) return;
  const win = ctx._win;
  switch(b.dataset.a){
    case 'restore': restoreWin(win); break;
    case 'min': minimizeWin(win); break;
    case 'max': setMax(win, true); break;
    case 'close': closeWin(win); break;
  }
  ctx._win = null;
});

/* 点击空白关闭右键菜单 */
document.addEventListener('pointerdown', e => {
  if(!e.target.closest('#ctxMenu')) ctx.classList.remove('open');
}, true);

/* =========================================================
   21. 关机
   ========================================================= */
function doShutdown(){
  closeAllPanels();
  const s = $('#shutdown');
  s.classList.add('on');
  setTimeout(() => {
    s.innerHTML = `<p style="font-size:15px">已关机。</p>
      <button style="margin-top:10px;padding:8px 24px;border-radius:4px;border:1px solid #555;color:#ddd;font-size:13px"
        onclick="location.reload()">重新启动</button>`;
  }, 2600);
}

/* =========================================================
   22. 快捷键
   ========================================================= */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    closeAllPanels();
  }
  /* 带输入框的窗口中按 Esc 也关闭面板 */
});

/* =========================================================
   23. 初始化
   ========================================================= */
setTimeout(() => {
  openApp('explorer', { x: 120, y: 80, w: 900, h: 560 });
}, 400);
</script>
